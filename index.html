<style>
:root{
  /* Idea: un club de dominó de noche. Riel de menú a la izquierda, la mesa de madera
     ocupa el centro y tu atril queda abajo. Cada mesa cambia solo estos colores. */
  --night:#14201d; --night-2:#21352f; --ink:#f3ecdc; --muted:#a3b3a9;
  --wood-a:#bd7d36; --wood-b:#875320; --surface:#efe8d8;
  --tile:#fbf7ec; --pip:#1d1a16;
  --accent:#f2b632; --us:#4fc3b2; --them:#ef7358;
  --display:'Alfa Slab One',Rockwell,'Roboto Slab',Georgia,serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
body[data-mesa="acera"]{--night:#1c2230;--night-2:#3a4560;--wood-a:#8c8f94;--wood-b:#5d6065;--surface:#d8d2c2;--accent:#ffd166}
body[data-mesa="bar"]{--night:#2a1410;--night-2:#5a2a1c;--wood-a:#6b3a1e;--wood-b:#3b1f0f;--surface:#cfc3a5;--accent:#ff6b57}
body[data-mesa="asado"]{--night:#2b1608;--night-2:#7a3a14;--wood-a:#a8602a;--wood-b:#6e3a14;--surface:#f1dcb0;--accent:#ff9f1c}
body[data-mesa="gollo"]{--night:#32160f;--night-2:#6b3020;--wood-a:#2f9590;--wood-b:#1c6360;--surface:#f4e3c3;--accent:#ffb347}
body[data-mesa="tito"]{--night:#181a1d;--night-2:#34383e;--wood-a:#7d8791;--wood-b:#4a525b;--surface:#e8e0cf;--accent:#f25c54}
body[data-mesa="apagon"]{--night:#08090f;--night-2:#1a1e2e;--wood-a:#5a4632;--wood-b:#2e2318;--surface:#cbbf9f;--accent:#ffcf5c}
body[data-mesa="jubilados"]{--night:#20271a;--night-2:#3d482c;--wood-a:#918a77;--wood-b:#5d584b;--surface:#d9d2bd;--accent:#e3c66c}
body[data-mesa="anoviejo"]{--night:#1a0f2e;--night-2:#3d1f66;--wood-a:#8a5a1d;--wood-b:#4a2e0e;--surface:#f2e8d0;--accent:#ff4fa0}
body[data-mesa="final"]{--night:#10261a;--night-2:#1f5236;--wood-a:#d4af37;--wood-b:#8f7421;--surface:#f6f1e0;--accent:#e8c547}
body[data-mesa="micaela"]{--night:#1d0a0c;--night-2:#4a1a1c;--wood-a:#a2672a;--wood-b:#5c3414;--surface:#f2e2bf;--accent:#ffcf6b}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 60% 35%,var(--night-2),var(--night) 70%);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.35;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2,h3,p{margin:0}

#app{height:100%;height:100dvh;display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#side{display:flex;flex-direction:column;gap:4px;padding:18px 12px;background:rgba(0,0,0,.28);min-width:0;min-height:0;overflow-y:auto}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.5px;padding:0 8px 2px;color:var(--accent)}
.brand .ico{width:1.05em;height:1.05em;vertical-align:-.15em;margin-right:.3em}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#side nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
#side button{background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#side button:hover:not(:disabled){background:rgba(255,255,255,.08)}
#side button.on{background:rgba(255,255,255,.12)}
#side button[hidden]{display:none}
#side button:disabled{color:var(--muted);cursor:default}
#side em{font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:1px 7px}
.wallet{margin-top:auto;display:grid;grid-template-columns:1fr;gap:8px;padding:8px}
.wallet div{background:rgba(0,0,0,.3);border-radius:10px;padding:8px 10px}
.wallet b{display:block;font-family:var(--display);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.wallet span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wallet .lv b,.wallet .pr b{font-size:17px}
.wallet span u{text-decoration:none}

main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px 18px 14px;min-width:0;min-height:0}
#top{display:grid;gap:6px}
#score{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end}
.sc{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
.sc .lab{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sc b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.sc i{flex:0 0 100%;height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:4px}

  .cup{width:26px;height:26px;top:8px}
  #me{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  #hand{grid-column:1/3;grid-row:1}
  #actions{flex-direction:row}
  #actions button{padding:7px 10px;font-size:14.5px}
  .cants{gap:4px}
}
@media (max-width:430px) and (orientation:portrait){
  #side{flex-wrap:wrap;row-gap:2px;padding:6px 16px 4px}
  #side nav{order:3;flex:1 1 100%;gap:2px}
  #side button{padding:4px 8px;font-size:14px}
}
/* Celular acostado: sin riel de menú, marcador en una sola línea y franja de perfil abajo */
@media (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  #side{display:none}
  main{padding:6px 14px 8px;gap:6px}
  #top{grid-template-columns:auto minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:10px}
  #btnMenu{display:block}
  #score{display:contents}
  .mid{display:none}
  .sc{flex-wrap:nowrap;align-items:center;gap:8px}
  .sc.us{order:1} #status{order:2} .sc.them{order:3}
  .sc i{flex:1 1 auto;margin:0;min-width:16px} .sc b{font-size:22px} .sc .lab{font-size:11px}
  #status{font-size:13.5px;line-height:1.2;min-height:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #table{padding:5px 6px 7px;border-radius:16px;gap:4px}
  .cup{display:none}
  .seat.top{min-height:0;gap:6px} .seat.top .who{display:flex;gap:6px;align-items:baseline}
  .seat.side{width:64px}
  .av{width:32px;height:32px;border-width:2px}
  .who b{font-size:13px} .who small{font-size:11px}
  .backs i{width:6px;height:11px}
  .backs.up svg{width:11px}
  #betPop{right:calc(100% + 8px);bottom:0}
  #me{grid-template-columns:auto minmax(0,1fr) auto;gap:10px;row-gap:0}
  #hand{grid-column:auto;grid-row:auto;min-height:64px;gap:7px}
  .htile{width:31px}
  .htile.sel{transform:translateY(-8px)}
  #meInfo .av{width:42px;height:42px;border-width:3px}
  #actions{flex-direction:column;gap:4px;align-items:flex-end}
  #actions button{padding:4px 10px;font-size:13px}
  .cants{gap:4px}
  #actions #badges{display:flex}
  #modal{padding:8px} #modalCard{padding:14px 16px;gap:8px} #modalCard h2{font-size:22px} .mood{font-size:44px}
}
/* ---------- Escenas de las mesas (fondo) ---------- */
#app{position:relative;z-index:1}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:background .6s}
#scene svg{position:absolute;left:0;width:100%;display:block;opacity:.8}
#scene #sceneTop{opacity:.6}
#sceneTop{top:0;opacity:.55;height:clamp(84px,17vh,160px);-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
#sceneBot{bottom:0;height:clamp(64px,13vh,130px);-webkit-mask-image:linear-gradient(0deg,#000 55%,transparent 100%);mask-image:linear-gradient(0deg,#000 55%,transparent 100%)}
#scene .a{fill:var(--accent)}
#scene .as{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
#scene .k{fill:rgba(0,0,0,.4)}
#scene .w{fill:rgba(255,255,255,.16)}
#scene .ws{fill:none;stroke:rgba(255,255,255,.3);stroke-width:3;stroke-linecap:round}
body[data-mesa="domingo"] #scene{background:radial-gradient(60% 55% at 82% 0%,rgba(255,214,140,.3),transparent 72%)}
body[data-mesa="acera"] #scene{background:radial-gradient(34% 40% at 27% 0%,rgba(255,209,102,.28),transparent 72%),radial-gradient(34% 40% at 77% 0%,rgba(255,209,102,.22),transparent 72%)}
body[data-mesa="bar"] #scene{background:radial-gradient(22% 48% at 12% 0%,rgba(255,150,60,.32),transparent 72%),radial-gradient(22% 48% at 28% 0%,rgba(255,150,60,.26),transparent 72%),radial-gradient(22% 48% at 72% 0%,rgba(255,150,60,.26),transparent 72%),radial-gradient(22% 48% at 88% 0%,rgba(255,150,60,.32),transparent 72%)}
body[data-mesa="asado"] #scene{background:radial-gradient(70% 45% at 50% 100%,rgba(255,120,20,.38),transparent 72%)}
body[data-mesa="gollo"] #scene{background:repeating-linear-gradient(100deg,transparent 0 17px,rgba(200,240,255,.11) 17px 18px),linear-gradient(180deg,rgba(47,149,144,.22),transparent 60%);background-size:60px 120px,auto;animation:rain .55s linear infinite}
body[data-mesa="tito"] #scene{background:linear-gradient(180deg,rgba(130,150,170,.22),transparent 45%),radial-gradient(30% 40% at 88% 0%,rgba(255,200,120,.2),transparent 72%)}
body[data-mesa="apagon"] #scene{background:radial-gradient(38% 30% at 50% 100%,rgba(255,190,80,.26),transparent 72%),radial-gradient(130% 110% at 50% 55%,transparent 38%,rgba(0,0,0,.6) 100%)}
body[data-mesa="jubilados"] #scene{background:radial-gradient(55% 42% at 50% 0%,rgba(240,220,150,.22),transparent 72%)}
body[data-mesa="anoviejo"] #scene{background:radial-gradient(28% 34% at 20% 6%,rgba(255,79,160,.3),transparent 72%),radial-gradient(28% 34% at 80% 8%,rgba(80,200,255,.26),transparent 72%),radial-gradient(28% 34% at 52% 2%,rgba(255,220,80,.22),transparent 72%)}
body[data-mesa="final"] #scene{background:radial-gradient(46% 60% at 0% 0%,rgba(255,255,230,.28),transparent 72%),radial-gradient(46% 60% at 100% 0%,rgba(255,255,230,.28),transparent 72%)}
body[data-mesa="micaela"] #scene{background:radial-gradient(110% 95% at 50% 42%,transparent 40%,rgba(40,15,5,.55) 100%),radial-gradient(40% 32% at 50% 0%,rgba(255,207,107,.26),transparent 72%)}
@keyframes rain{to{background-position:-60px 120px,0 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{50%{opacity:.3}}
@keyframes fl{0%{transform:scale(1,1)}100%{transform:scale(.9,1.1) translateX(1px)}}
@keyframes fw{0%{transform:scale(.1);opacity:1}70%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes smk{0%{transform:translateY(8px);opacity:0}30%{opacity:.4}100%{transform:translateY(-40px);opacity:0}}
@keyframes neon{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
@keyframes nt{0%{transform:translate(0,10px);opacity:0}20%{opacity:.8}100%{transform:translate(14px,-30px);opacity:0}}
@keyframes glow{50%{opacity:.4}}
#scene .spin{animation:spin 70s linear infinite}
#scene .tw{animation:tw 2.4s ease-in-out infinite}
#scene .fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate}
#scene .fw{transform-box:fill-box;transform-origin:center;opacity:.7;animation:fw 3.4s ease-out infinite}
#scene .smk{opacity:.25;animation:smk 5s ease-in infinite}
#scene .neon{animation:neon 6s linear infinite}
#scene .note{opacity:.5;animation:nt 4s ease-out infinite}
#scene .gl{animation:glow 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';

  /* Cantar "Aquí te espero" (idea de Pepe, 13 de noviembre): en tu turno, con 3 fichas o más, y una vez por mano.

     Se apunta al rival que juega justo antes que tú. Aciertas si esa jugada abre un número nuevo, tu firme sigue

  function canWait(h, p) {

  }

    var hand = h.hands[w.caller];
    return hand.some(function (a, i) {
      if (a[0] !== Y && a[1] !== Y) return false;
      return hand.some(function (b, j) { return j !== i && (b[0] === w.X || b[1] === w.X); });
    });
  }
  function canBet(h, p) {
    return !!h.first && !h.over && h.hands[p].length >= 3 && !(h.bets || []).some(function (b) { return b.caller === p; });
  }
  function declareBet(h, p, kind) {
    if (kind !== 'tranque' && kind !== 'domino') return false;
    if (!canBet(h, p)) return false;
    h.bets = h.bets || [];
    h.bets.push({ caller: p, kind: kind });
    return true;
  }
  function resolveBets(h) {
    var ev = [];
    if (!h.over || h.betsDone) return ev;
    h.betsDone = true;
    var s = scoreHand(h);
    (h.bets || []).forEach(function (b) {
      var hit = b.kind === 'domino'
        ? (h.over.type === 'domino' && TEAM(h.over.winner) === TEAM(b.caller))
        : (h.over.type === 'tranque' && s.team === TEAM(b.caller));
      ev.push({ type: 'bet', caller: b.caller, kind: b.kind, hit: hit });
    });
    return ev;
  }
  function pips(hand) { return hand.reduce(function (s, t) { return s + t[0] + t[1]; }, 0); }
  /* Gana la pareja con menos puntos y se lleva los puntos de los rivales.
     Si el tranque queda empatado, pierde la pareja que trancó. */
  function scoreHand(h) {
    var pts = h.hands.map(pips);
    var team = [pts[0] + pts[2], pts[1] + pts[3]];
    var w, tie = false;
    if (h.over.type === 'domino') w = TEAM(h.over.winner);
    else if (team[0] < team[1]) w = 0;
    else if (team[1] < team[0]) w = 1;
    else { tie = true; w = 1 - TEAM(h.over.blocker); }
    return { team: w, points: team[1 - w], teamPts: team, pts: pts, tie: tie };
  }

  /* ---------- Bots ---------- */
  function unseen(h, p, v) {
    var n = 0;
    h.played.forEach(function (t) { if (t[0] === v || t[1] === v) n++; });
    h.hands[p].forEach(function (t) { if (t[0] === v || t[1] === v) n++; });
    return 7 - n;
  }
  /* Jugada "de oficio": suelta peso y dobles, conserva variedad, ataca lo que el rival no lleva
     y cuida lo que la pareja no lleva. Es el nivel medio y también la política de las simulaciones. */
  function heuristicMove(h, p, rnd) {
    var moves = legalMoves(h, p);
    if (!moves.length) return null;
    var next = (p + 1) % 4, mate = (p + 2) % 4, prev = (p + 3) % 4;
    var best = null, bestS = -1e9, hand = h.hands[p];
    for (var k = 0; k < moves.length; k++) {
      var m = moves[k], t = hand[m.i], ne = endsAfter(h, t, m.side);
      var s = (t[0] + t[1]) + (t[0] === t[1] ? 4 : 0) + rnd() * 1.5;
      for (var j = 0; j < hand.length; j++) {
        var o = hand[j];
        if (j !== m.i && (o[0] === ne[0] || o[1] === ne[0] || o[0] === ne[1] || o[1] === ne[1])) s += 3;
      }
      for (var q = 0; q < 2; q++) {
        var v = ne[q];
        if (h.lacks[next][v]) s += 5;
        if (h.lacks[prev][v]) s += 2;
        if (h.lacks[mate][v]) s -= 4;

  /* Fichas que el jugador p no ve: ni jugadas ni en su mano. */
  function hiddenTiles(h, p) {
    var seen = {};
    h.played.forEach(function (t) { seen[t[0] + '-' + t[1]] = 1; });
    h.hands[p].forEach(function (t) { seen[t[0] + '-' + t[1]] = 1; });

      first: h.first ? {} : null, left: [], right: [], ends: h.ends ? h.ends.slice() : null,
      turn: h.turn, starter: h.starter, needSix: h.needSix, last: h.last,
      lacks: h.lacks.map(function (o) { var c = {}; for (var k in o) c[k] = true; return c; }),

      var rest = shuffle(pool.slice(), rnd), hands = [null, null, null, null], ok = true;

        var strict = attempt < 29;
        for (var j = 0; j < rest.length; j++) {

  }

    var guard = 0;
    while (!w.over && guard++ < 120) {

     con cada ficha candidata y se queda con la que mejor resultado promedia. */
  /* Aquí te espero para bots: imagina N repartos, juega la ficha con el canto puesto, deja que juegue el rival
     que va justo antes y cuenta en cuántos el golpe se da. Canta si la tasa pasa el umbral del bot (el pago es +3/−1,
     así que con 25% ya se empata). Seat 3 no lo usa: quien juega antes que él es su propia pareja. */
  function waitChance(h, p, m, rnd, worlds) {

    var holds = h.hands[p].some(function (q, j) { return j !== m.i && (q[0] === Y || q[1] === Y); });
    if (!holds) return 0;

    for (var i = 0; i < n; i++) {

      for (var k = 0; k < 3 && !done && !w.over; k++) {

        ev = mv ? playTile(w, q, mv.i, mv.side, null) : passTurn(w, q);
        ev.forEach(function (e) { if (e.type === 'wait' && e.caller === p) { done = true; if (e.hit) hits++; } });
      }

  function searchMove(h, p, rnd, N, callAt, betAt, style) {
    style = style || {};

    var seenKey = {}, moves = [];
    raw.forEach(function (m) {
      var ne = endsAfter(h, h.hands[p][m.i], m.side);
      var key = m.i + ':' + Math.min(ne[0], ne[1]) + ':' + Math.max(ne[0], ne[1]);

      var vals = best.ne[0] === best.ne[1] ? [best.ne[0]] : best.ne;
      var open = 0;
      vals.forEach(function (e) { if (!h.lacks[next][e]) open += unseen(h, p, e); });
      var tk = style.talk || 1;
      if (style.sure) { if (open === 0 && rnd() < 0.95) call = next; }
      else if (level === 'facil') { if (open === 0 ? rnd() < Math.min(0.9, 0.25 * tk) : (tk > 1 && open === 1 && rnd() < 0.12 * tk)) call = next; }
      else if (open === 0 ? rnd() < Math.min(0.95, 0.6 * tk) : (open === 1 ? rnd() < Math.min(0.5, 0.15 * tk) : (tk > 1 && open === 2 && rnd() < 0.08 * tk))) call = next;
    }
    var wait = false;
    if (style.trap != null && canWait(h, p)) {
      var ws = []; for (var wi = 0; wi < 10; wi++) ws.push(sampleWorld(h, p, rnd));
      wait = waitChance(h, p, best, rnd, ws) >= style.trap;

  /* ---------- Dibujo de la cadena ----------
     Cada ficha ocupa dos casillas de 1x1. La cadena crece desde el centro:

      else right = right.concat([extra.tile]);
    }
    if (!f) return out;

    var eL, eR;
    if (f.a === f.b) {
      out.push({ cx: 0, cy: 0, ang: 90, v1: f.a, v2: f.b, key: 'F' });
      eL = { x: -0.5, y: 0, dbl: true }; eR = { x: 0.5, y: 0, dbl: true };
    } else {
      out.push({ cx: 0.5, cy: 0, ang: 0, v1: f.a, v2: f.b, key: 'F' });
      eL = { x: -0.5, y: 0 }; eR = { x: 1.5, y: 0 };
    }

  var FS = (function () {

      var b = document.getElementById('btnFs'); if (!b) return;
      b.hidden = hidden(); b.textContent = on() ? 'Salir de pantalla completa' : 'Pantalla completa';

      if (on()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      if (!req) { toast('En iPhone: toca Compartir y luego "Agregar a pantalla de inicio". Así se abre sin barras.', 'good'); return; }
      try {

          if (g !== gen) return;
          while (next < ctx.currentTime + 0.4) {
            var s = i % 16, bar = ((i / 8) | 0) % 4, pos = i % 8, cyc = i % 96;
            if (cyc === 0) hs.gain.setTargetAtTime(0.008, next, 0.2);
            if (cyc === 80) hs.gain.setTargetAtTime(0.0001, next, 0.3);
            if (cyc >= 80) { next += step; i++; continue; } /* la radio descansa unos 4 segundos cada 22 */
            if (CL[s]) tone(1100, 0.07, 0.2, 'triangle', next, rad);
            if (pos === 2 || pos === 7) puff(0.04, 'bandpass', 900, 1, 0.25, next, rad);
            if (pos === 4) tone(330, 0.15, 0.22, 'sine', next, rad, 250);
            if (pos === 5) tone(300, 0.15, 0.18, 'sine', next, rad, 230);
            if (pos === 3 || pos === 4) tone(roots[bar], 0.28, 0.35, 'triangle', next, rad);
            if (pos === 6) tone(roots[bar] * 1.5, 0.25, 0.3, 'triangle', next, rad);
            if (pos === 2 || pos === 5 || pos === 7) chords[bar].forEach(function (f) { tone(f, 0.18, 0.06, 'triangle', next, rad); });
            next += step; i++;
          }
          h.id = setTimeout(sched, 100);
        })();
      },
      apagon: function () {
        /* Sin ruido de base: grillos sueltos, una ráfaga de viento, el chisporroteo de una vela y un trueno raro, con silencios largos */
        later(function () { var t = ctx.currentTime; for (var k = 0; k < 3; k++) tone(3000, 0.05, 0.01, 'sine', t + k * 0.09); }, 5000, 14000);
        later(function () { swell('bandpass', 450, 0.8, 0.03, 2.2, 3.2); }, 12000, 25000);
        later(function () { puff(0.02, 'highpass', 2500, 0.7, 0.04); }, 6000, 16000);
        later(function () { puff(2.6, 'lowpass', 140, 0.7, 0.2); }, 40000, 90000);
      },
      jubilados: function () {
        /* El reloj suena por tandas con silencios; fichas que se barajan de vez en cuando */
        var tk = 0, ticking = true, gg = gen, h = { id: 0 };
        function flip() { if (gg !== gen) return; ticking = !ticking; h.id = setTimeout(flip, (ticking ? 12 + rr() * 8 : 8 + rr() * 8) * 1000); }
        timers.push(h); h.id = setTimeout(flip, 14000);
        later(function () { if (!ticking) return; tk++; puff(0.012, 'bandpass', tk % 2 ? 1800 : 1300, 3, tk % 2 ? 0.07 : 0.05); }, 1000, 1000);
        later(function () { var t = ctx.currentTime; for (var k = 0; k < 6; k++) puff(0.05, 'bandpass', 1500 + rr() * 800, 1.2, 0.08, t + k * (0.07 + rr() * 0.08)); }, 9000, 22000);
      },
      anoviejo: function () {
        /* Fuegos artificiales espaciados y una corneta de fiesta, sin ruido de base */
        later(function () {
          var t = ctx.currentTime;
          tone(500, 0.6, 0.03, 'sine', t, bus, 1900); puff(0.7, 'lowpass', 900, 0.7, 0.2, t + 0.65);
          for (var k = 0; k < 8; k++) puff(0.03, 'highpass', 4000, 0.7, 0.05, t + 0.7 + k * 0.07 + rr() * 0.05);
        }, 7000, 18000);
        later(function () {
          var t = ctx.currentTime, lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600; lp.connect(bus);
          tone(660, 0.22, 0.035, 'sawtooth', t, lp); tone(660, 0.3, 0.035, 'sawtooth', t + 0.3, lp);
        }, 16000, 35000);
      },
      final: function () {
        /* Sin ruido de base: la multitud se emociona de vez en cuando (sube, aplaude y se calla) */
        later(function () {
          var t = ctx.currentTime;
          swell('bandpass', 700, 0.5, 0.09, 1.2, 3.2, t);
          if (rr() < 0.65) for (var k = 0; k < 10; k++) puff(0.03, 'bandpass', 1500, 1, 0.1, t + 1.5 + k * 0.11 + rr() * 0.05);
        }, 9000, 20000);
      },
      micaela: function () {
        /* Cajita de música alegre en do mayor: frases de 8 compases con bajo saltarín y maraca suave, y un respiro entre frases */
        var dl = ctx.createDelay(1); dl.delayTime.value = 0.24; var fb = ctx.createGain(); fb.gain.value = 0.26;
        dl.connect(fb); fb.connect(dl); dl.connect(bus);
        var dry = ctx.createGain(); dry.connect(bus); dry.connect(dl);
        var step = 0.24, next = ctx.currentTime + 0.2, i = 0, last = 1, g = gen, h = { id: 0 };
        var ch = [[523.3, 659.3, 784, 1046.5], [440, 523.3, 698.5, 880], [392, 493.9, 587.3, 784], [523.3, 659.3, 784, 1046.5]];
        var bass = [130.8, 174.6, 98, 130.8], fifth = [196, 261.6, 147, 196], mv = [-1, 0, 1, 1, -1, 2, -2];
        timers.push(h);
        (function sched() {
          if (g !== gen) return;
          while (next < ctx.currentTime + 0.4) {
            var pos = i % 8, nb = (i / 8) | 0, bar = nb % 4;
            if (nb % 10 < 8) {
              if (pos === 0) tone(bass[bar], 0.3, 0.08, 'triangle', next, bus);
              if (pos === 4) tone(fifth[bar], 0.25, 0.06, 'triangle', next, bus);
              if (pos % 2 === 1) puff(0.03, 'bandpass', 3200, 1.5, 0.022, next, bus);
              if (pos !== 1 && pos !== 5 && rr() < 0.82) {
                last = Math.max(0, Math.min(3, last + mv[(rr() * 7) | 0]));
                var f = ch[bar][last];
                tone(f, 0.45, 0.06, 'sine', next, dry); tone(f * 3, 0.18, 0.012, 'sine', next, dry);
              }
            }
            next += step; i++;
          }
          h.id = setTimeout(sched, 100);
        })();
      }
    };
    function stopScene() {
      gen++; timers.forEach(function (h) { clearTimeout(h.id); }); timers = [];
      var ob = bus, os = stops; stops = []; bus = null;
      if (ob && ctx) {
        ob.gain.cancelScheduledValues(ctx.currentTime); ob.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
        setTimeout(function () { os.forEach(function (s) { try { s.stop(); } catch (e) {} }); try { ob.disconnect(); } catch (e) {} }, 900);
      }
    }
    function startScene() {
      if (!ctx || !on || !unlocked) return;
      stopScene();
      bus = ctx.createGain(); bus.gain.value = 0; bus.connect(master); bus.gain.setTargetAtTime(1, ctx.currentTime, 0.5);
      (SC[cur] || SC.domingo)();
    }
    function label() {
      var e = document.getElementById('sndEm'); if (e) e.textContent = on ? 'Sí' : 'No';
    }
    function unlock() {
      if (!on) return;
      if (!init()) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (!unlocked) { unlocked = true; startScene(); }
    }
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlock, { passive: true }); });
    document.addEventListener('visibilitychange', function () {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else if (on) ctx.resume();
    });
    return {
      setMesa: function (id) { cur = id; startScene(); },
      isOn: function () { return on; },
      toggle: function () {
        on = !on; try { localStorage.setItem('domino-bravo-snd', on ? '1' : '0'); } catch (e) {}
        if (on) { unlocked = false; unlock(); } else stopScene();
        label(); return on;
      },
      label: label,
      clack: function () {
        if (!ctx || !on || !unlocked) return;
        puff(0.05, 'bandpass', 2200, 1.2, 0.35, null, fx); tone(180, 0.06, 0.25, 'sine', null, fx, 90);
      }
    };
  })();

  /* ---------- Arranque ---------- */
  function start(data) {
    SND.label();
    applyMesa(P.mesa);
    var g = (data && data.G) || loadG();
    var valid = g && g.H && g.scores && g.seats && [1, 2, 3].every(function (p) { return BOTS[g.seats[p]]; });
    if (valid) {
      G = g;
      if (!G.H.scored) step();
      else if (G.scores[0] >= META || G.scores[1] >= META) { G.done = true; renderAll(); say('Partida terminada.'); showMenu(); }
      else startHand(false);
    } else { G = null; showMenu(); }
    if (!P.seen) showAyuda();
  }
  /* App instalable: el service worker (sw.js) deja abrir el juego sin conexión. Solo en https o localhost. */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { G: G }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>

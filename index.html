<style>
:root{
  /* Idea: un club de dominó de noche. Riel de menú a la izquierda, la mesa de madera
     ocupa el centro y tu atril queda abajo. Cada mesa cambia solo estos colores. */
  --night:#14201d; --night-2:#21352f; --ink:#f3ecdc; --muted:#a3b3a9;
  --wood-a:#bd7d36; --wood-b:#875320; --surface:#efe8d8;
  --tile:#fbf7ec; --pip:#1d1a16;
  --accent:#f2b632; --us:#4fc3b2; --them:#ef7358;
  --display:'Alfa Slab One',Rockwell,'Roboto Slab',Georgia,serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
body[data-mesa="acera"]{--night:#1c2230;--night-2:#3a4560;--wood-a:#8c8f94;--wood-b:#5d6065;--surface:#d8d2c2;--accent:#ffd166}
body[data-mesa="bar"]{--night:#2a1410;--night-2:#5a2a1c;--wood-a:#6b3a1e;--wood-b:#3b1f0f;--surface:#cfc3a5;--accent:#ff6b57}
body[data-mesa="asado"]{--night:#2b1608;--night-2:#7a3a14;--wood-a:#a8602a;--wood-b:#6e3a14;--surface:#f1dcb0;--accent:#ff9f1c}
body[data-mesa="gollo"]{--night:#32160f;--night-2:#6b3020;--wood-a:#2f9590;--wood-b:#1c6360;--surface:#f4e3c3;--accent:#ffb347}
body[data-mesa="tito"]{--night:#181a1d;--night-2:#34383e;--wood-a:#7d8791;--wood-b:#4a525b;--surface:#e8e0cf;--accent:#f25c54}
body[data-mesa="apagon"]{--night:#08090f;--night-2:#1a1e2e;--wood-a:#5a4632;--wood-b:#2e2318;--surface:#cbbf9f;--accent:#ffcf5c}
body[data-mesa="jubilados"]{--night:#20271a;--night-2:#3d482c;--wood-a:#918a77;--wood-b:#5d584b;--surface:#d9d2bd;--accent:#e3c66c}
body[data-mesa="anoviejo"]{--night:#1a0f2e;--night-2:#3d1f66;--wood-a:#8a5a1d;--wood-b:#4a2e0e;--surface:#f2e8d0;--accent:#ff4fa0}
body[data-mesa="final"]{--night:#10261a;--night-2:#1f5236;--wood-a:#d4af37;--wood-b:#8f7421;--surface:#f6f1e0;--accent:#e8c547}
body[data-mesa="micaela"]{--night:#1d0a0c;--night-2:#4a1a1c;--wood-a:#a2672a;--wood-b:#5c3414;--surface:#f2e2bf;--accent:#ffcf6b}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 60% 35%,var(--night-2),var(--night) 70%);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.35;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2,h3,p{margin:0}

#app{height:100%;height:100dvh;display:grid;grid-template-columns:244px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#side{display:flex;flex-direction:column;gap:4px;padding:18px 12px;background:rgba(0,0,0,.28);min-width:0;min-height:0;overflow-y:auto}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.5px;padding:0 8px 2px;color:var(--accent)}
.brand .ico{width:1.05em;height:1.05em;vertical-align:-.15em;margin-right:.3em}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#side nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
#side button{background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#side button:hover:not(:disabled){background:rgba(255,255,255,.08)}
#side button.on{background:rgba(255,255,255,.12)}
#side button[hidden]{display:none}
#side button:disabled{color:var(--muted);cursor:default}
#side .ml,.menu .ml{display:flex;align-items:center;gap:10px;min-width:0}
.mi{width:22px;height:22px;flex:none}
#side .mi{width:20px;height:20px;opacity:.85}
#side .ml span{white-space:nowrap}
#side em{font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:1px 7px}
.wallet{margin-top:auto;display:grid;grid-template-columns:1fr;gap:8px;padding:8px}
.wallet div{background:rgba(0,0,0,.3);border-radius:10px;padding:8px 10px}
.wallet b{display:block;font-family:var(--display);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.wallet span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wallet .lv b,.wallet .pr b{font-size:17px}
.wallet span u{text-decoration:none}

main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px 18px 14px;min-width:0;min-height:0}
#top{display:grid;gap:6px}
#score{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end}
.sc{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
.sc .lab{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sc b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.sc i{flex:0 0 100%;height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:4px}
.sc u{display:block;height:100%;border-radius:9px;transition:width .5s}
.sc.us .lab{color:var(--us)} .sc.us u{background:var(--us)}
.sc.them{justify-content:flex-end} .sc.them .lab{color:var(--them)} .sc.them u{background:var(--them);margin-left:auto}
.mid{text-align:center;padding-bottom:6px}
.mid b{display:block;font-size:17px}
.mid span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#status{min-height:1.35em;font-size:17px;font-weight:500;text-align:center}

#table{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:10px 10px 14px;
  border-radius:28px;background:linear-gradient(135deg,var(--wood-a),var(--wood-b));min-height:0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),inset 0 -8px 18px rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.5)}
.cup{position:absolute;top:10px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 50% 35%,rgba(0,0,0,.55),rgba(0,0,0,.25));box-shadow:inset 0 3px 6px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.2)}
.cup.l{left:12px} .cup.r{right:12px}
#surface{grid-column:2;grid-row:2;position:relative;border-radius:14px;background:var(--surface);overflow:hidden;min-height:0;
  box-shadow:inset 0 3px 12px rgba(0,0,0,.3),0 0 0 3px rgba(0,0,0,.18)}
#board{position:absolute;inset:0;width:100%;height:100%}
.tb{fill:var(--tile);stroke:rgba(0,0,0,.4);stroke-width:.035}
.tl{stroke:rgba(0,0,0,.32);stroke-width:.035}
.pp circle{fill:var(--pip)}
.ring{fill:none;stroke-width:.1}
.bt.us .ring{stroke:var(--us)} .bt.them .ring{stroke:var(--them)}
.fly{position:fixed;z-index:20;pointer-events:none;border-radius:8px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
.fly svg{display:block;width:100%;height:100%;overflow:visible}
.fly .tb{stroke-width:.09} .fly.us .tb{stroke:var(--us)} .fly.them .tb{stroke:var(--them)}
.ghost{cursor:pointer}
.ghost .tb,.ghost .tl,.ghost .pp{opacity:.4}
.gh{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:.08;stroke-dasharray:.2 .12;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{fill-opacity:.5}}

.seat{position:relative;display:flex;align-items:center;gap:8px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.seat.top{grid-column:1/4;grid-row:1;justify-content:center;min-height:50px}
.seat.side{flex-direction:column;justify-content:center;text-align:center;width:84px;grid-row:2}
#seat3{grid-column:1} #seat1{grid-column:3}
.av{display:block;width:46px;height:46px;flex:none;border-radius:50%;padding:0;border:3px solid rgba(0,0,0,.35);background:none;overflow:hidden;cursor:default}
.av svg{display:block;width:100%;height:100%}
.seat.turn .av,.av.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 16px var(--accent)}
.seat.pick .av{cursor:pointer;border-color:#fff;animation:pick .7s ease-in-out infinite alternate}
@keyframes pick{to{transform:scale(1.12)}}
.who b{display:block;font-size:16px;line-height:1.1}
.who small{display:block;font-size:12.5px;opacity:.9}
.backs{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:76px}
.backs i{width:8px;height:15px;border-radius:2px;background:var(--tile);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.backs.up{max-width:84px;gap:3px}
.backs.up svg{display:block;width:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.seat.top .backs.up{max-width:none}
.seat.top .backs{max-width:none}
.flag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#1d1a16;text-shadow:none;border-radius:99px;padding:2px 8px;white-space:nowrap}
.bubble{position:absolute;z-index:5;background:#fff;color:#1d1a16;text-shadow:none;font-weight:700;border-radius:12px;padding:6px 12px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.seat.top .bubble{top:100%;left:50%;transform:translateX(-50%)}
#seat3 .bubble{left:92%;top:30%} #seat1 .bubble{right:92%;top:30%}

#me{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr) minmax(120px,auto);align-items:center;gap:12px}
#meInfo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;border-radius:12px;padding:2px 6px 2px 2px;margin-left:-2px}
#meInfo:hover{background:rgba(255,255,255,.06)}
.youp{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--accent)} .youp svg{width:15px;height:15px}
.yo{display:flex;align-items:center;gap:14px} .yo .av{width:64px;height:64px;flex:none} .yo h2{margin:0} .yo p{margin:2px 0 0;color:var(--muted)}
.yostats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px} .yostats div{background:rgba(0,0,0,.25);border-radius:12px;padding:10px;text-align:center}
.yostats b{display:block;font-size:22px} .yostats span{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#hand{display:flex;justify-content:center;gap:6px;min-height:84px;align-items:flex-end}
.htile{background:none;border:0;padding:0;width:clamp(36px,min(10.5vw,8.4vh),56px);border-radius:8px;transition:transform .14s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.htile svg{display:block;width:100%}
.htile.dim{filter:drop-shadow(0 4px 4px rgba(0,0,0,.45)) brightness(.8)}
.htile.ok:hover{transform:translateY(-5px)}
.htile.sel{transform:translateY(-13px)}
#actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#actions button,.acts button,.mesa button{border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);border-radius:10px;padding:8px 14px;font-weight:700;font-size:16px}
#actions button:disabled,.mesa button:disabled{opacity:.4;cursor:default}
#btnSing.armed{background:var(--accent);border-color:var(--accent);color:#1d1a16}
#betPop button[disabled]{opacity:.4}
#me.espera-ok{animation:esperaOk .9s ease-out 1}
@keyframes esperaOk{0%{box-shadow:0 0 0 0 var(--accent)}40%{box-shadow:0 0 0 10px rgba(255,255,255,.0),0 0 28px 6px var(--accent)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
#actions{position:relative}
.cants{display:flex;gap:6px}
.cants button{flex:1;white-space:nowrap}
#btnBack{background:var(--accent)!important;border-color:var(--accent)!important;color:#1d1a16}
#betPop{position:absolute;right:0;bottom:calc(100% + 8px);z-index:12;width:min(250px,80vw);display:grid;gap:6px;padding:10px;background:var(--night);border:1px solid rgba(255,255,255,.25);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
#betPop[hidden]{display:none}
#betPop small{color:var(--muted);font-size:12.5px;line-height:1.25}
#betPop button{text-align:left;display:grid;gap:1px}
#betPop button span{font-weight:500;font-size:13px;color:var(--muted)}
#btnPass,.acts .primary{background:var(--accent);border-color:var(--accent);color:#1d1a16}

#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:40;width:min(92vw,460px);pointer-events:none}
.toast{background:#fffaf0;color:#1d1a16;border-left:6px solid var(--muted);border-radius:10px;padding:9px 14px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.45);animation:tin .25s ease-out}
.toast.good{border-color:#2f9e6e} .toast.bad{border-color:#d2452d}
@keyframes tin{from{transform:translateY(-10px);opacity:.3}}

#modal{position:fixed;inset:0;z-index:30;background:rgba(6,10,9,.72);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modalCard{position:relative;width:min(100%,540px);max-height:100%;overflow:auto;background:var(--night);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:22px 22px 18px;display:grid;gap:12px}
#modalCard h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;text-wrap:balance}
#modalCard h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.x{position:absolute;top:14px;right:14px;background:none;border:0;color:var(--muted);font-weight:600;text-decoration:underline}
.reveal{width:100%;border-collapse:collapse}
.reveal th{text-align:left;font-weight:700;padding:5px 8px 5px 0;white-space:nowrap}
.reveal tr.us th{color:var(--us)} .reveal tr.them th{color:var(--them)}
.reveal td{padding:5px 0;border-top:1px solid rgba(255,255,255,.1)} .reveal th{border-top:1px solid rgba(255,255,255,.1)}
.reveal .tiles{display:flex;flex-wrap:wrap;gap:3px;border-top:0}
.reveal tr{border-top:1px solid rgba(255,255,255,.1)}
.mini{width:17px;display:block}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;width:3ch}
.gain{font-family:var(--display);font-size:22px} .gain.us{color:var(--us)} .gain.them{color:var(--them)}
.tot b{font-variant-numeric:tabular-nums}
.final{border-top:2px solid var(--accent);padding-top:12px;display:grid;gap:8px}
.final ul,.help,.acc,.ranks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.help{counter-reset:h;gap:10px} .help li{counter-increment:h;padding-left:34px;position:relative;max-width:62ch}
.help li::before{content:counter(h);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1d1a16;font-weight:700;display:grid;place-items:center;font-size:14px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.mesas{display:grid;gap:8px}
.mesa{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px}
.mesa p{color:var(--muted);font-size:15px} .mesa small{color:var(--accent)}
.mesa.locked b{color:var(--muted)}
.lock{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sw{width:46px;height:46px;border-radius:10px;display:grid;place-items:center}
.sw i{width:26px;height:26px;border-radius:5px}
.mesa[data-mesa="clasica"] .sw{background:linear-gradient(135deg,#bd7d36,#875320)} .mesa[data-mesa="clasica"] .sw i{background:#efe8d8}
.mesa[data-mesa="terraza"] .sw{background:linear-gradient(135deg,#2f9590,#1c6360)} .mesa[data-mesa="terraza"] .sw i{background:#f4e3c3}
.mesa[data-mesa="costera"] .sw{background:linear-gradient(135deg,#cdb88d,#978259)} .mesa[data-mesa="costera"] .sw i{background:#f2f4f5}
.mesa[data-mesa="vegas"] .sw{background:linear-gradient(135deg,#4a3521,#22170d)} .mesa[data-mesa="vegas"] .sw i{background:#1f7a4d}
.mesa[data-mesa="parque"] .sw{background:linear-gradient(135deg,#918a77,#5d584b)} .mesa[data-mesa="parque"] .sw i{background:#d9d2bd}
.mesa small{display:block;margin-top:2px}
.lgd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.note{color:var(--muted);font-size:14px}
.flag.mpclk{background:#f3ecdc;min-width:38px;text-align:center}
.flag.mpclk.low{background:var(--them);color:#fff}
.lobby{display:grid;gap:12px}
.lobby .code{font-size:40px;font-weight:800;letter-spacing:.18em;text-align:center;line-height:1.1;user-select:all}
.lobby .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.lobby .row svg{width:40px;height:40px;border-radius:50%;flex:none}
.lobby .row b{flex:1;min-width:0;overflow-wrap:anywhere}
.lobby .row small{color:var(--muted);display:block;font-weight:500}
.lobby .row.free{color:var(--muted);font-style:italic;justify-content:center}
.lobby .row button{font-size:13px;font-weight:700;border:2px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 10px;background:none}
.lobby .row button.on{background:var(--accent);border-color:var(--accent);color:#1d1a16}
.lobby h3{margin:4px 0 -4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:2px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 12px;font-weight:700;background:rgba(0,0,0,.25)}
.opts button.on{background:var(--accent);border-color:var(--accent);color:#1d1a16}
.opts button:disabled{opacity:.7}
.pf{display:flex;align-items:center;gap:12px}
.pf .av{width:56px;height:56px;flex:none;border-radius:50%;overflow:hidden;display:block}
.pf .av.big{width:84px;height:84px}
.pf .av svg{display:block;width:100%;height:100%}
.pf b{display:block;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.pf small{display:block;color:var(--muted);font-size:14px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25);padding:0}
.swb.on{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.lk{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--ink)}
.lk svg{width:48px;height:48px;border-radius:50%}
.lk span{font-size:13px;font-weight:700;line-height:1.15;text-align:center}
.lk em{font-style:normal;font-size:12px;color:var(--muted)}
.lk.paid em{color:var(--accent)}
.lk.on{border-color:var(--accent);background:rgba(242,182,50,.14)}
.ed .acts button:disabled{opacity:.45}
.about{margin-top:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);color:var(--muted);font-size:14px;line-height:1.45;display:grid;gap:6px}.about h3{font-size:15px;color:var(--ink);letter-spacing:.02em}.about a{color:var(--accent)}.about-links{text-align:center}
.legal{margin:10px 0 0;color:var(--muted);font-size:13px;text-align:center}.legal a{color:inherit;text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.stats div{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.acc li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px;color:var(--muted)}
.acc li span{grid-column:1;font-size:14.5px} .acc li em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.acc li.has{color:var(--ink)} .acc li.has em{color:var(--accent)}
.ranks{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} .ranks em{white-space:nowrap}
.ranks li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.1);padding:3px 0;color:var(--muted)}
.ranks li.has{color:var(--ink);font-weight:600} .ranks em{font-style:normal;font-variant-numeric:tabular-nums}

.lvls{display:grid;gap:8px}
.lvl{display:grid;gap:6px;text-align:left;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);border-radius:14px;padding:10px 14px}
.lvl:hover:not(:disabled){border-color:var(--accent)}
.lvl:disabled{cursor:default;border-color:rgba(255,255,255,.12);color:var(--muted)}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lh b{font-family:var(--display);font-weight:400;font-size:21px} .lh i{font-style:normal;font-size:13px;color:var(--accent);font-weight:700}
.ln{font-size:14.5px;color:var(--muted)}
.faces{display:flex;flex-wrap:wrap;gap:6px 14px}
.face{display:flex;align-items:center;gap:6px;font-size:15px}
.face svg,.face .shade{display:block;width:34px;height:34px;border-radius:50%;flex:none}
.face .shade{background:rgba(255,255,255,.12)}
.face em{font-style:normal;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--us);border:1px solid currentColor;border-radius:99px;padding:0 6px}
.lvup{border-left:4px solid var(--accent);padding-left:10px}
.emb svg,.bull{width:16px;height:16px;vertical-align:-3px}
.emb{margin-left:4px;display:inline-block}
.lapbox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:1px solid var(--accent);border-radius:14px;padding:10px 12px;background:rgba(242,182,50,.08);margin:6px 0}
.lapbox .bull{width:58px;height:58px}
.lapbox p{margin:2px 0 8px}
.lapbox .acts{display:flex;gap:8px;flex-wrap:wrap}
.embrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.embi{display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);filter:grayscale(1);opacity:.45}
.embi.has{filter:none;opacity:1;color:var(--ink)}
.embi .bull{width:40px;height:40px}
.bets{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.bets .ok{color:var(--us)} .bets .no{color:var(--them)}
.mood{font-size:68px;line-height:1;animation:bob .9s ease-in-out 3 alternate}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(6deg)}}
.menu{display:grid;gap:8px}
.menu button{display:flex;justify-content:space-between;align-items:center;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);border-radius:12px;padding:12px 16px;font-weight:700;font-size:18px;text-align:left}
.menu button.primary{background:var(--accent);border-color:var(--accent);color:#1d1a16}
.menu button:disabled{color:var(--muted);border-color:rgba(255,255,255,.12);cursor:default}
.acc{display:grid;gap:10px}
.acc label{display:grid;gap:4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.acc input{font:inherit;font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink);background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.3);border-radius:10px;padding:10px 12px;width:100%}
.acc .pw{position:relative;display:block} .acc .pw input{padding-right:48px}
.acc .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:8px}
.acc .eye svg{width:22px;height:22px} .acc .eye.on{color:var(--accent)} .acc .eye:not(.on) .slash{display:none}
.mid b{display:inline-block;vertical-align:middle}

<noscript><main style="max-width:700px;margin:0 auto;padding:20px;color:#f3ecdc;font-family:system-ui"><section class="about" aria-labelledby="about-h"><h3 id="about-h">Sobre Domino Bravo</h3><p>Domino Bravo es dominó en parejas, a 75 puntos, gratis en el celular o la computadora. Tú y tu compañero, sentado al frente, juegan contra dos rivales con las 28 fichas del doble seis: gana la mano quien domina primero o la pareja con menos puntos si la mesa se tranca.</p><p>Además de ganar, aquí se premia saber: si cantas a tiempo el pase de un rival, un tranque o un domino de tu pareja, ganas prestigio y subes de rango. Hay 11 mesas para abrir, rivales de Fácil a Leyendas que cuentan fichas y juegan en pareja, monedas, emblemas y partidas con tus amigos por código.</p><p class="about-links"><a href="guia.html">Guía</a> · <a href="como-jugar.html">Reglas</a> · <a href="estrategia-en-pareja.html">Jugar en pareja</a> · <a href="contar-fichas.html">Contar fichas</a> · <a href="glosario.html">Glosario</a> · <a href="preguntas.html">Preguntas</a></p></section><p>Para jugar, activa JavaScript en tu navegador.</p></main></noscript>

<script>
'use strict';
/* Motor de reglas: dominó doble seis, 4 jugadores en parejas (0 y 2 contra 1 y 3).
   El turno corre hacia la derecha: 0 (abajo) -> 1 (derecha) -> 2 (arriba) -> 3 (izquierda). */
var E = (function () {
  var TEAM = function (p) { return p % 2; };

  function newDeck() {
    var d = [];
    for (var a = 0; a <= 6; a++) for (var b = a; b <= 6; b++) d.push([a, b]);
    return d;
  }
  function shuffle(a, rnd) {
    rnd = rnd || Math.random;
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function newHand(starter, isFirst, rnd) {
    var d = shuffle(newDeck(), rnd);
    var hands = [0, 1, 2, 3].map(function (i) { return d.slice(i * 7, i * 7 + 7); });
    var st = starter;
    if (isFirst) {
      st = hands.findIndex(function (h) {
        return h.some(function (t) { return t[0] === 6 && t[1] === 6; });
      });
    }
    return {
      hands: hands, first: null, left: [], right: [], ends: null,
      turn: st, starter: st, needSix: !!isFirst, last: null,
      lacks: [0, 1, 2, 3].map(function () { return {}; }),
      calls: [], bets: [], waits: [], waitUsed: {}, over: null, played: [], log: []
    };
  }
  function legalMoves(h, p) {
    var out = [], hand = h.hands[p];
    if (!h.first) {
      hand.forEach(function (t, i) {
        if (!h.needSix || (t[0] === 6 && t[1] === 6)) out.push({ i: i, side: 'F' });
      });
      return out;
    }
    var L = h.ends[0], R = h.ends[1];
    hand.forEach(function (t, i) {
      if (t[0] === L || t[1] === L) out.push({ i: i, side: 'L' });
      if (t[0] === R || t[1] === R) out.push({ i: i, side: 'R' });
    });
    return out;
  }
  function canPlay(h, p) { return legalMoves(h, p).length > 0; }
  function endsAfter(h, t, side) {
    if (side === 'F') return [t[0], t[1]];
    var L = h.ends[0], R = h.ends[1];
    if (side === 'L') return [t[0] === L ? t[1] : t[0], R];
    return [L, t[0] === R ? t[1] : t[0]];
  }
  function resolveCalls(h, p, passed) {
    var ev = [];
    h.calls = h.calls.filter(function (c) {
      if (c.target !== p) return true;
      ev.push({ type: 'call', caller: c.caller, target: p, hit: passed });
      return false;
    });
    return ev;
  }
  /* Juega la ficha i del jugador p. callTarget: a quién le canta el pase (o null). */
  function playTile(h, p, i, side, callTarget, wait) {
    var t = h.hands[p][i];
    var okWait = !!wait && side !== 'F' && canWait(h, p);
    h.waits = h.waits || []; h.waitUsed = h.waitUsed || {};
    var ev = resolveCalls(h, p, false);
    var ne = endsAfter(h, t, side);
    if (h.log) h.log.push({ p: p, t: t.slice(), m: side === 'F' ? null : h.ends[side === 'L' ? 0 : 1], six: !!h.needSix });
    h.hands[p].splice(i, 1);
    if (side === 'F') h.first = { a: t[0], b: t[1] };
    else if (side === 'L') h.left.push({ inner: h.ends[0], outer: ne[0] });
    else h.right.push({ inner: h.ends[1], outer: ne[1] });
    h.ends = ne; h.last = p; h.needSix = false; h.played.push(t);
    /* "Aquí te espero": primero se resuelven los que me apuntan a mí; después se anota el mío. */
    var Y = side === 'F' ? null : (side === 'L' ? ne[0] : ne[1]);
    h.waits = h.waits.filter(function (w) {
      if (w.target !== p) return true;
      ev.push({ type: 'wait', caller: w.caller, target: p, hit: waitHit(h, w, Y), X: w.X, Y: Y, passed: false });
      return false;
    });
    if (okWait) {
      var Xn = Y, holds = h.hands[p].some(function (q) { return q[0] === Xn || q[1] === Xn; });
      if (holds) { h.waits.push({ caller: p, target: (p + 3) % 4, X: Xn }); h.waitUsed[p] = true; ev.push({ type: 'waitset', caller: p, X: Xn, target: (p + 3) % 4 }); }
      else ev.push({ type: 'waitvoid', caller: p });
    }
    if (callTarget != null) h.calls.push({ caller: p, target: callTarget });
    if (h.hands[p].length === 0) {
      h.over = { type: 'domino', winner: p };
      h.calls = [];
    } else if (![0, 1, 2, 3].some(function (q) { return canPlay(h, q); })) {
      h.over = { type: 'tranque', blocker: p };
      h.calls.forEach(function (c) {
        ev.push({ type: 'call', caller: c.caller, target: c.target, hit: true });
      });
      h.calls = [];
    } else {
      h.turn = (p + 1) % 4;
    }
    return ev;
  }
  function passTurn(h, p) {
    h.lacks[p][h.ends[0]] = true;
    h.lacks[p][h.ends[1]] = true;
    var ev = resolveCalls(h, p, true);
    h.waits = (h.waits || []).filter(function (w) {
      if (w.target !== p) return true;
      ev.push({ type: 'wait', caller: w.caller, target: p, hit: false, X: w.X, Y: null, passed: true });
      return false;
    });
    h.turn = (p + 1) % 4;
    return ev;
  }
  /* Cantos de mano: "tranque" (la mano se tranca y la gana mi pareja o yo) o "domino"
     (mi pareja o yo dominamos). Uno por jugador y por mano, con 3 fichas o más en la mano.

  /* ---------- Pantalla completa ----------
     Android y computador: API de pantalla completa. iPhone no la permite en páginas web: ahí se avisa cómo agregar el juego a la pantalla de inicio (se abre sin barras). */
  var FS = (function () {

      b.hidden = hidden(); b.textContent = on() ? 'Salir de pantalla completa' : 'Pantalla completa'; decoSide(b);
    }
    function toggle() {
      if (on()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      if (!req) { toast('En iPhone: toca Compartir y luego "Agregar a pantalla de inicio". Así se abre sin barras.', 'good'); return; }
      try {
        var r = req.call(de); if (r && r.catch) r.catch(function () { toast('Tu navegador no dejó poner pantalla completa.', 'bad'); });

      else mpMsg(link, true);
    }
    else if (a === 'mp-share') { try { navigator.share({ title: 'Domino Bravo', text: 'Te invito a mi mesa de Domino Bravo. Código: ' + MP.code, url: mpLink() }).catch(function () {}); } catch (e) { /* idem */ } }
    else if (a === 'mp-back') { MP.auto = false; MP.strikes = 0; mpTell(); closeModal(); if (G && G.H && !G.H.over) step(); }
    else if (a === 'mp-next') mpNext();
    else if (!MP.host) return;
    else if (a === 'mp-mate') db.update(rref('meta'), { mate: MP.meta.mate === b.dataset.u ? '' : b.dataset.u });
    else if (a === 'mp-clock') db.update(rref('meta'), { clock: +b.dataset.v });
    else if (a === 'mp-lvl') db.update(rref('meta'), { lvl: b.dataset.v });
    else if (a === 'mp-start') mpStart();
    else if (a === 'mp-rematch') { b.disabled = true; db.update(rref('meta'), { match: MP.match + 1 }); }
  }

  /* Empieza (o retoma) una partida: arma la mesa vista desde mi asiento y se pone a leer la lista de jugadas. */
  function mpBegin(again) {
    var meta = MP.meta, db = FB.m.db, uid = FB.user.uid, k = -1;
    [0, 1, 2, 3].forEach(function (i) { if (meta.seats[i] && meta.seats[i].u === uid) k = i; });
    if (k < 0) { lsDel(MESAK); mpStop(); showAmigos('Esa mesa ya empezó a jugar sin ti.'); return; }
    MP.k = k; MP.match = meta.match; MP.next = 0; MP.buf = {}; MP.pending = false;
    if (!again) { MP.des = 0; MP.strikes = 0; }
    clearTimeout(timer); clearTimeout(MP.wT); clearTimeout(MP.nT); clearInterval(MP.ci);
    if (MP.unLog) try { MP.unLog(); } catch (e) { /* idem */ }
    var seats = [null];
    [1, 2, 3].forEach(function (l) {
      var s = meta.seats[can(l)];
      if (s.b && BOTS[s.b]) { seats[l] = s.b; return; }
      var pl = MP.players[s.u] || {}, av = pl.av || {}, id = 'mp:' + (s.u || l);
      BOTS[id] = { name: pl.alias || 'Jugador', skin: av.skin || '#d9a577', look: LOOKS[av.look] ? av.look : 'me', shirt: av.shirt || '#f3ecdc', level: 'medio', human: true, uid: s.u };
      seats[l] = id;
    });
    G = { mp: true, scores: [0, 0], handNo: 0, H: null, lastKey: null, level: 'medio', seats: seats };
    peekOn = false; resultMemo = null; sel = null; callTarget = null; callMode = false; betOpen = false; waitArm = false; lastMsg = '';
    closeModal(); say('Repartiendo…');
    MP.unLog = db.onChildAdded(rref('log/' + MP.match), function (s) {
      if (!MP) return;
      MP.buf[+s.key] = s.val();
      clearTimeout(MP.pumpT); MP.pumpT = setTimeout(mpPump, 30);
    });
    /* El anfitrión reparte la primera mano. Si ya estaba repartida (recargó la página), la transacción no escribe nada. */
    if (MP.host) mpSend({ t: 'deal', seed: Math.floor(Math.random() * 2147483647), first: true }, 0);
  }
  /* Aplica en orden las jugadas recibidas. Si hay varias en cola (alguien recargó), las pasa sin animación. */
  function mpPump() {
    if (!MP || !G || !G.mp) return;
    while (MP && MP.buf[MP.next] !== undefined) {
      var a = MP.buf[MP.next], more = MP.buf[MP.next + 1] !== undefined;
      delete MP.buf[MP.next]; MP.next++; MP.pending = false;
      if (!mpApply(a, more)) { mpDesync(); return; }
    }
  }
  function mpDesync() {
    MP.des++;
    if (MP.des > 2) { toast('No pude sincronizar la mesa. Sal y vuelve a entrar con el código.', 'bad'); return; }
    toast('Reacomodando la mesa…');
    mpBegin(true);
  }
  function mpScore() { var H = G.H; H.scored = true; var r = E.scoreHand(H); E.resolveBets(H); G.scores[r.team] += r.points; }
  function mpApply(a, fast) {
    var H = G.H, p, ev;
    if (!a || !a.t) return false;
    if (a.t === 'deal') {
      if (H && !H.over) return false;
      if (H && !H.scored) mpScore();
      if (G.scores[0] >= META || G.scores[1] >= META) return false;
      var Hc = E.newHand(a.first ? 0 : (a.st || 0), !!a.first, mpRng(a.seed));
      var hc = Hc.hands;
      Hc.hands = [0, 1, 2, 3].map(function (l) { return hc[can(l)]; });
      Hc.turn = Hc.starter = loc(Hc.starter);
      G.handNo++; G.H = Hc; G.lastKey = null;
      flyKey = null; lastRect = null; lastMsg = ''; sel = null; callTarget = null; callMode = false;
      betOpen = false; waitArm = false; peekOn = false; resultMemo = null; comboSt = 0; passRun = 0; curL = null;
      clearTimeout(MP.nT);
      if (!fast) { closeModal(); step(); }
      return true;
    }
    if (!H || H.over || typeof a.s !== 'number') return false;
    p = loc(a.s);
    if (H.turn !== p) return false;
    if (a.t === 'pass') {
      if (E.canPlay(H, p)) return false;
      ev = E.passTurn(H, p);
      if (fast) { passRun++; return true; }
      if (p === 0) { callTarget = null; callMode = false; waitArm = false; sel = null; lastMsg = 'Pasaste. '; toast('No tenías ficha: pasaste.'); }
      else { bubble(p, 'Paso'); lastMsg = nm(p) + ' pasó. '; }
      passHit();
      applyEvents(ev); step();
      return true;
    }
    if (a.t !== 'play') return false;
    if (!E.legalMoves(H, p).some(function (m) { return m.i === a.i && m.side === a.side; })) return false;
    var t = H.hands[p][a.i], call = a.call == null ? null : loc(a.call), says = [];
    var betOk = a.bet ? E.declareBet(H, p, a.bet) : false;
    ev = E.playTile(H, p, a.i, a.side, call, !!a.wait);
    G.lastKey = keyOf(a.side); G.lastBy = p; passRun = 0;
    if (fast) return true;
    if (p === 0) { lastMsg = ''; sel = null; callTarget = null; callMode = false; betOpen = false; waitArm = false; }
    else {
      lastMsg = nm(p) + ' puso el ' + t[0] + '-' + t[1] + '. ';
      if (betOk) { says.push('Canto ' + a.bet); lastMsg += 'Cantó ' + a.bet + '. '; }
      if (call != null) says.push(call === 0 ? 'Tú pasas' : nm(call) + ' pasa');
      if (a.wait) says.push('Aquí te espero');
      if (says.length) bubble(p, says.join(' · '));
    }
    applyEvents(ev); step(); fly(p);
    return true;
  }
  /* Escribe la jugada número n. Solo entra si nadie escribió antes ese número. */
  function mpSend(a, n) {
    if (!MP) return;
    var db = FB.m.db, m = MP.match;
    if (n == null) n = MP.next;
    Object.keys(a).forEach(function (k) { if (a[k] == null) delete a[k]; });
    MP.pending = true;
    db.runTransaction(rref('log/' + m + '/' + n), function (cur) { return cur === null ? a : undefined; }, { applyLocally: false })
      .catch(function () {
        if (!MP || MP.match !== m || MP.next !== n) return;
        MP.pending = false; toast('No se pudo enviar la jugada. Revisa tu conexión.', 'bad');
        if (G && G.H && !G.H.over) step();
      });
  }
  function mpPlay(i, side) {
    var H = G.H;
    if (MP.pending || MP.auto || H.over || H.turn !== 0) return;
    MP.strikes = 0;
    mpSend({ t: 'play', s: MP.k, i: i, side: side, call: callTarget == null ? null : can(callTarget), wait: !!waitArm, bet: betOf(0) });
    sel = null; renderMe();
  }
  /* El anfitrión juega por un bot, o por una persona que se fue o dejó pasar el reloj. */
  function mpBot(p) {
    var H = G.H;
    if (!MP || MP.pending || !H || H.over || H.turn !== p) return;
    var b = p === 0 ? null : BOTS[G.seats[p]], human = !b || b.human;
    var m = E.botMove(H, p, null, human ? 'medio' : b.level, human ? undefined : b.style);
    if (!m) mpSend({ t: 'pass', s: can(p) });
    else mpSend({ t: 'play', s: can(p), i: m.i, side: m.side, call: m.call == null ? null : can(m.call), wait: !!m.wait, bet: m.bet || null });
  }
  /* Se llama en cada cambio de turno. Devuelve true si el turno NO lo juega esta persona ahora. */
  function mpTurn(p) {
    var H = G.H;
    MP.t0 = Date.now(); mpClockStart(p);
    if (p === 0) {
      if (!MP.auto) return false;
      say('Un bot juega por ti.');
      if (MP.host) { clearTimeout(MP.wT); MP.wT = setTimeout(function () { mpBot(0); }, 1900); }
      return true;
    }
    if (!H.first) say('Mano ' + G.handNo + ': sale ' + nm(p) + (H.needSix ? ' con el doble seis.' : '.'));
    else say(lastMsg + 'Juega ' + nm(p) + '.');
    mpWatch();
    return true;
  }
  function mpWatch() {
    clearTimeout(MP.wT);
    var H = G.H;
    if (!MP.host || !H || H.over) return;
    var p = H.turn, wait;
    if (p === 0) { if (MP.auto) MP.wT = setTimeout(function () { mpBot(0); }, 1900); return; }
    var b = BOTS[G.seats[p]];
    if (!b.human) wait = 1900;
    else {
      var pl = MP.players[b.uid] || {};
      if (pl.bot) wait = 1900;
      else if (pl.on === false || pl.left) wait = 5000;
      else if (MP.meta.clock > 0) wait = MP.meta.clock * 1000 + 6000;
      else return;
    }
    wait = Math.max(600, wait - (Date.now() - MP.t0));
    MP.wT = setTimeout(function () { if (MP && G.H === H) mpBot(p); }, wait);
  }
  function mpFlags(p) {
    var H = G.H, out = '';
    if (!MP) return out;
    if (p !== 0) {
      var b = BOTS[G.seats[p]], pl = b && b.human && (MP.players[b.uid] || {});
      if (pl && (pl.bot || pl.left || pl.on === false)) out += '<span class="flag">' + (pl.left ? 'Se fue: juega un bot' : pl.on === false ? 'Desconectado' : 'Juega un bot') + '</span>';
    } else if (MP.auto) out += '<span class="flag">Un bot juega por ti</span>';
    if (!H.over && H.turn === p && MP.cp === p && MP.left != null) out += '<span class="flag mpclk' + (MP.left <= 3 ? ' low' : '') + '">' + MP.left + ' s</span>';
    return out;
  }
  function mpClockStart(p) {
    clearInterval(MP.ci); MP.cp = p; MP.left = null;
    var c = MP.meta.clock;
    if (!(c > 0) || !G.H || G.H.over) return;
    function tick() {
      if (!MP || !G || !G.H) return;
      var left = Math.max(0, Math.ceil(c - (Date.now() - MP.t0) / 1000));
      if (left !== MP.left) {
        MP.left = left;
        var els = document.querySelectorAll('.mpclk');
        if (!els.length) { renderSeats(); renderMe(); }
        else els.forEach(function (el) { el.textContent = left + ' s'; el.classList.toggle('low', left <= 3); });
      }
      if (left <= 0) { clearInterval(MP.ci); if (p === 0 && !MP.auto && !MP.pending && !G.H.over && G.H.turn === 0) mpTimeout(); }
    }
    MP.left = c; MP.ci = setInterval(tick, 250);
  }
  /* Se me acabó el tiempo: el reloj juega una ficha por mí. A la tercera seguida, un bot toma mi lugar hasta que yo vuelva. */
  function mpTimeout() {
    var H = G.H, m = E.botMove(H, 0, null, 'medio');
    if (!m) return;
    MP.strikes++;
    sel = null; callTarget = null; callMode = false; betOpen = false; waitArm = false;
    mpSend({ t: 'play', s: MP.k, i: m.i, side: m.side, bet: betOf(0) });
    if (MP.strikes >= 3) {
      MP.auto = true; mpTell();
      openModal('<p class="eyebrow">Con amigos</p><h2>Un bot está jugando por ti</h2><p>Dejaste pasar el reloj tres veces seguidas. Para que la mesa no se frene, un bot juega tu mano hasta que vuelvas.</p>' +
        '<div class="acts"><button type="button" class="primary" data-act="mp-back">Volver a jugar</button></div>', true);
    } else toast('Se acabó tu tiempo: el reloj jugó por ti.', 'bad');
  }
  /* Avisos de cantos en partida amistosa: se cuenta qué pasó, sin sumar ni restar prestigio. */
  function mpEvent(e) {
    if (e.type === 'bet') return;
    var c = nm(e.caller), t = nm(e.target), msg, kind = '';
    if (e.type === 'wait') {
      if (e.caller === 0) { msg = e.hit ? '¡Te estaba esperando! Puedes golpear el ' + e.Y + ' sin soltar tu firme.' : 'Aquí te espero: no se dio el golpe.'; kind = e.hit ? 'good' : 'bad'; }
      else if (e.target === 0) { msg = e.hit ? c + ' te estaba esperando y dio el golpe.' : c + ' se quedó esperando.'; kind = e.hit ? 'bad' : 'good'; }
      else return;
    } else if (e.hit) {
      if (e.caller === 0) { msg = 'Acertaste: ' + t + ' pasó.'; kind = 'good'; }
      else if (e.target === 0) { msg = c + ' cantó tu pase y acertó.'; kind = 'bad'; }
      else msg = c + ' acertó el pase de ' + t + '.';
    } else {
      if (e.caller === 0) { msg = 'Fallaste: ' + t + ' tenía ficha.'; kind = 'bad'; }
      else if (e.target === 0) { msg = c + ' cantó tu pase y falló.'; kind = 'good'; }
      else msg = c + ' falló el canto: ' + t + ' tenía ficha.';
    }
    toast(msg, kind);
  }
  function mpNext() {
    clearTimeout(MP.nT);
    var H = G.H;
    if (!MP.host || MP.pending || !H || !H.over || G.scores[0] >= META || G.scores[1] >= META) return;
    mpSend({ t: 'deal', seed: Math.floor(Math.random() * 2147483647), first: false, st: can((H.starter + 1) % 4) });
  }
  /* Botones del fin de mano y del fin de partida con amigos. */
  function mpHandEnd(won) {
    var over = G.scores[0] >= META || G.scores[1] >= META, peek = '<button type="button" data-act="peek">Ver mesa</button>';
    if (!over) {
      if (MP.host) { clearTimeout(MP.nT); MP.nT = setTimeout(mpNext, 25000); }
      return MP.host ? '<div class="acts">' + peek + '<button type="button" class="primary" data-act="mp-next">Siguiente mano</button></div>'
        : '<p class="note">El anfitrión reparte la siguiente mano.</p><div class="acts">' + peek + '</div>';
    }
    G.done = true;
    var lines = ['Partida amistosa: no cambia monedas, rating ni prestigio.'], dl = dailyLine();
    if (dl) { lines.push(dl); saveP(); renderScore(); }
    var won2 = G.scores[0] >= META;
    return '<div class="final"><div class="mood" aria-hidden="true">' + (won2 ? '🏆' : '🤝') + '</div><h2>' + (won2 ? 'Partida ganada' : 'Partida perdida') + '</h2><ul>' +
      lines.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ul></div>' +
      (MP.host ? '' : '<p class="note">El anfitrión decide si hay revancha.</p>') +
      '<div class="acts">' + peek + '<button type="button" data-act="mp-leave">Salir de la mesa</button>' +
      (MP.host ? '<button type="button" class="primary" data-act="mp-rematch">Revancha</button>' : '') + '</div>';
  }
  /* Al abrir el juego: si vengo de un link de invitación (?mesa=CÓDIGO) o estaba sentado en una mesa, vuelvo a ella. */
  function mpAuto() {
    if (MP || mpBusy) return;
    var saved = lsGet(MESAK);
    if (!FB.user) { if (mpWant) showAmigos(); return; }
    if (mpWant) { if (!P.alias) showAmigos(); else mpJoin(mpWant); }
    else if (saved) mpJoin(saved, true);
  }
  (function () {
    var q = null;
    try { q = new URLSearchParams(location.search).get('mesa'); } catch (e) { /* idem */ }
    if (q) { ssSet(WANTK, cleanCode(q)); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* idem */ } }
    mpWant = ssGet(WANTK) || null;
    var av = ssGet('domino-bravo-aviso');
    if (av) { ssSet('domino-bravo-aviso', null); setTimeout(function () { toast(av); }, 700); }
    if (mpWant || lsGet(MESAK)) setTimeout(fbLoad, 50);
  })();

  function start(data) {
    SND.label();
    applyMesa(P.mesa);
    var g = (data && data.G) || loadG();
    var valid = g && g.H && g.scores && g.seats && [1, 2, 3].every(function (p) { return BOTS[g.seats[p]]; });
    if (valid) {
      G = g;
      if (!G.H.scored) step();
      else if (G.scores[0] >= META || G.scores[1] >= META) { G.done = true; renderAll(); say('Partida terminada.'); showMenu(); }
      else startHand(false);
    } else { G = null; showMenu(); }
    if (!P.seen) showAyuda();
  }
  /* App instalable: el service worker (sw.js) deja abrir el juego sin conexión. Solo en https o localhost. */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { G: G }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
